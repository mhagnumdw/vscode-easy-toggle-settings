name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version (X.Y.Z)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Never interpolate ${{ inputs.version }} inside run:, it would run as shell code
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version format
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format. Use X.Y.Z"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-cliff needs the full history and the tags

      - name: Setup, Test and Package
        uses: ./.github/actions/common-tasks
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}

      - name: Setup git user.name and user.email
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Bump version
        run: npm version "$VERSION" --no-git-tag-version

      - name: Update CHANGELOG
        uses: orhun/git-cliff-action@v4
        with:
          args: --unreleased --prepend CHANGELOG.md
        env:
          GIT_CLIFF_TAG: v${{ inputs.version }}
          # Outside the workspace, otherwise the action's default output ends up inside the VSIX
          OUTPUT: ${{ runner.temp }}/cliff-output.md

      - name: Commit and tag the release
        run: |
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): v$VERSION [skip ci]"
          git tag -a "v$VERSION" -m "chore(release): v$VERSION [skip ci]"

      - name: Publish to VS Code Marketplace
        run: |
          npx vsce publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        run: |
          npx ovsx publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Push git changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tags: true
          branch: ${{ github.ref }}

      - name: Generate release notes
        id: release-notes
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip all
        env:
          OUTPUT: ${{ runner.temp }}/RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ inputs.version }}"
          name: "v${{ inputs.version }}"
          body: ${{ steps.release-notes.outputs.content }}
          draft: false
          prerelease: false
